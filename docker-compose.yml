services:
  api:
    build: .
    cpus: "1.0"
    mem_limit: 1500m
    volumes:
      - appdata:/app/data
      - appmodels:/app/models
    expose:
      - "8000"
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
volumes:
  appdata:
  appmodels:
